[package]
name = "Actuate"
version = "1.4.6"
edition = "2024"
authors = ["Ardura <azviscarra@gmail.com>"]
license = "GPL-3.0-or-later"
homepage = "https://github.com/ardura"
description = "Sampler + Synth"
publish = false

[workspace]
members = ["xtask"]

[lib]
crate-type = ["cdylib","lib"]

[dependencies]
hound = "3.5.0"
lazy_static = "1.4.0"

# egui is now independent
egui = { git = "https://github.com/emilk/egui.git", version = "0.34.1", default-features = false, features = ["default_fonts","bytemuck"] }

# Nih plug fork for actuate
nice-plug = { git = "https://codeberg.org/BillyDM/nice-plug.git", rev = "9590b34061e4df280e9b0ea0e4ff0083b3eedc44", features = ["assert_process_allocs"] }
nice-plug-egui = { git = "https://codeberg.org/BillyDM/nice-plug.git", rev = "9590b34061e4df280e9b0ea0e4ff0083b3eedc44" }

num-complex = "0.4.4"
num-traits = "0.2.17"
once_cell = "1.18.0"
parking_lot = "0.12.1"
pitch_shift = "1.0.0"
rand = "0.10.1"
rand_pcg = "0.10.2"
serde = "1.0.188"
serde_json = "1.0.107"
dirs = "6.0.0"
walkdir = "2.5.0"
rayon = "1.10.0"
anyhow = "1.0.97"
ureq = { version = "3.0.10", features = ["json"] }
zip = "8.6.0"

[profile.release]
opt-level = 3
split-debuginfo = 'packed'
debug = false
debug-assertions = false
overflow-checks = false
lto = 'thin'
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
strip = "symbols"

[profile.profiling]
inherits = "release"
split-debuginfo = '...'
debug = true
rpath = false
lto = "off"
opt-level = 0
strip = "none"
